name: Build Hive Seller Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/boutique/**'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies in apps/boutique
        run: |
          cd apps/boutique
          npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          cd apps/boutique
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd apps/boutique/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-seller-debug.apk
          path: apps/boutique/android/app/build/outputs/apk/debug/app-debug.apk
