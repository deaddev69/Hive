name: Build Hive Seller Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/boutique/**'
      - '.github/workflows/build-seller-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor sync (generate Android native deps)
        run: |
          cd apps/boutique
          mkdir -p public
          echo '<!-- placeholder -->' > public/index.html
          npx cap sync android --inline

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd apps/boutique/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-seller-debug
          path: apps/boutique/android/app/build/outputs/apk/debug/app-debug.apk




